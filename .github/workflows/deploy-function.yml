# Déploie la fonction serveur « recherche » sur Supabase à chaque modification de son code.
# Prérequis (une seule fois) : secret Actions SUPABASE_ACCESS_TOKEN
#   (Supabase > Account > Access Tokens > Generate new token).
# Le projet est déduit de la variable publique VITE_SUPABASE_URL (https://<ref>.supabase.co).
name: Fonction recherche

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : déploiement ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#')
          if ! echo "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::Impossible de lire l'identifiant du projet depuis VITE_SUPABASE_URL."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: 3.2.0
      # --no-verify-jwt : la fonction vérifie elle-même le jeton de session (réglage « Verify JWT » désactivé)
      # --use-api : empaquetage côté Supabase, sans Docker ; --yes : pas de confirmation interactive en CI
      - name: Déployer
        if: steps.cfg.outputs.ok == 'true'
        run: supabase functions deploy recherche --project-ref "${{ steps.cfg.outputs.ref }}" --no-verify-jwt --use-api --yes
